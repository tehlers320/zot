name: Publish Docker Hub image

on:
  push:
    branches:
      - blob-streaming
  workflow_dispatch:
    inputs:
      tag:
        description: Docker image tag
        required: true
        default: blob-streaming
        type: string

permissions:
  contents: read

concurrency:
  group: dockerhub-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: tehlersexpedia
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create multi-architecture builder
        run: |
          docker buildx create --driver docker-container --name zot-${{ matrix.arch }} --use
          docker buildx inspect --bootstrap

      - name: Build and publish architecture image
        env:
          IMAGE: docker.io/tehlersexpedia/zot-fork
        run: |
          docker buildx build \
            --platform linux/${{ matrix.arch }} \
            --file build/Dockerfile \
            --build-arg COMMIT="${GITHUB_SHA}" \
            --provenance=false \
            --tag "${IMAGE}:${GITHUB_SHA}-${{ matrix.arch }}" \
            --push \
            .

  publish:
    name: Publish multi-architecture manifest
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: tehlersexpedia
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Merge architecture images
        env:
          IMAGE: docker.io/tehlersexpedia/zot-fork
          IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || 'blob-streaming' }}
        run: |
          short_sha="${GITHUB_SHA:0:12}"
          docker buildx imagetools create \
            --tag "${IMAGE}:${IMAGE_TAG}" \
            --tag "${IMAGE}:sha-${short_sha}" \
            "${IMAGE}:${GITHUB_SHA}-amd64" \
            "${IMAGE}:${GITHUB_SHA}-arm64"

      - name: Verify published platforms
        env:
          IMAGE: docker.io/tehlersexpedia/zot-fork
          IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || 'blob-streaming' }}
        run: docker buildx imagetools inspect "${IMAGE}:${IMAGE_TAG}"
